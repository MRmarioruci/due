name: Android APK

# Builds an installable APK on every push to main and publishes it as the GitHub
# Release for the version in package.json (bump the version for a new release;
# pushing the same version again replaces that release's APK). Same as hush.
# For a dev build, run it from any other branch (Actions → Android APK → Run
# workflow → pick the branch): it publishes a separate pre-release instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Baked into the app at build time (EXPO_PUBLIC_*). Set them under
      # Settings → Secrets and variables → Actions.
      EXPO_PUBLIC_DUE_API_URL: ${{ secrets.DUE_API_URL }}
      EXPO_PUBLIC_DUE_APP_KEY: ${{ secrets.DUE_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npx tsc --noEmit && npx vitest run

      - name: Generate Android project
        run: |
          npx expo prebuild --platform android --no-install
          # The default 2 GB heap runs out while packaging the release APK; the runner has 16 GB.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          grep jvmargs android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            # Surface the real error as an annotation (readable without downloading logs).
            grep -E -A4 "^e: |What went wrong" build.log | grep -v "^--$" | head -9 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/due-${VERSION}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: due-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: due ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/*.apk
          body: |
            Download the APK below on your Android phone and open it to install.
            If Android asks, allow your browser to install unknown apps.

      - name: Publish test build
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.ref_name }}
          name: due ${{ env.VERSION }} (${{ github.ref_name }} test build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*.apk
          body: Test build from the ${{ github.ref_name }} branch. Not the stable release.
